name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установка Gradle 8.7
        run: |
          for url in \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip
          do
            curl -fL --retry 5 --retry-delay 5 -o /tmp/gradle.zip "$url" && break
          done
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Подготовка ключа подписи (если задан секрет)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Сборка пакетов платформ (вшиваются в APK)
        run: |
          python3 tools/build_packs.py
          mkdir -p app/src/main/assets/packs
          cp packs/*.db app/src/main/assets/packs/

      - name: Сборка APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/*.apk GameCollection-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GameCollection
          path: |
            GameCollection-*.apk
            packs/*.db
            packs/manifest.json

      - name: Релиз (только по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GameCollection-*.apk
            packs/*.db
            packs/manifest.json
